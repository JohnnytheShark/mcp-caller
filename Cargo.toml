[package]
name = "mcp-caller"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Johnny Orellana"]
description = "A lightweight CLI tool (curl for MCP) to discover, inspect, and invoke Model Context Protocol server tools directly with interactive schema prompts."
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/JohnnytheShark/mcp-caller"
keywords = ["mcp", "model-context-protocol", "cli", "tools", "json-rpc"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# CLI & Terminal UI
clap = { version = "4.5", features = ["derive", "cargo"] }
inquire = "0.7"
colored = "2.1"
comfy-table = "7.1"

# Async & Process Handling
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"

# Serialization & JSON
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error Handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
directories = "5.0"
shell-words = "1.1"
